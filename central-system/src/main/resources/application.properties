spring.application.name=central-system
server.port=8081

# --- Base de Datos (CORREGIDO) ---
# He añadido '&allowPublicKeyRetrieval=true' al final. Esto soluciona el error de conexión.
spring.datasource.url=jdbc:mysql://localhost:3307/air_quality_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Kafka Consumer ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=grupo-gestion-aire
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer